<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Plans</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ========== Sidebar ========== -->
  <div class="sidebar">
    <div class="logo">Gym<span>Fit</span></div>
    <div class="sub">Admin Panel</div>
    <a href="index.html">👥 Members</a>
    <a href="plans.html" class="active">💳 Plans</a>
    <a href="classes.html">📅 Classes</a>
    <a href="trainers.html">🏋️ Trainers</a>
    <a href="bookings.html">📝 Bookings</a>
    <a href="messages.html">✉️ Messages</a>
    <a href="../client/index.html" class="site-link">← View Website</a>
  </div>

  <!-- ========== Main ========== -->
  <div class="main">
    <h1>Membership Plans</h1>
    <p class="page-sub">These plans are shown on the website's Plans page</p>

    <!-- Add / Edit form -->
    <div class="box">
      <h2 id="formTitle">Add New Plan</h2>
      <form id="planForm">
        <div class="form-row">
          <div>
            <label>Plan Name</label>
            <input type="text" id="name" required>
          </div>
          <div>
            <label>Price (₹)</label>
            <input type="number" id="price" min="0" required>
          </div>
          <div>
            <label>Duration</label>
            <input type="text" id="duration" placeholder="e.g. 3 Months" required>
          </div>
        </div>
        <div style="margin-bottom:16px">
          <label>Features (separate with commas)</label>
          <input type="text" id="features" placeholder="Gym access, Locker room, Diet chart" required>
        </div>
        <button type="submit" class="btn" id="saveBtn">Add Plan</button>
        <button type="button" class="btn btn-grey" onclick="cancelEdit()">Clear</button>
      </form>
    </div>

    <!-- Plans table -->
    <div class="box">
      <h2>All Plans</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Price</th>
            <th>Duration</th>
            <th>Features</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="../client/js/storage.js"></script>
  <script src="js/plans.js"></script>
</body>
</html>
