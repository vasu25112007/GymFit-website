<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Messages</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ========== Sidebar ========== -->
  <div class="sidebar">
    <div class="logo">Gym<span>Fit</span></div>
    <div class="sub">Admin Panel</div>
    <a href="index.html">👥 Members</a>
    <a href="plans.html">💳 Plans</a>
    <a href="classes.html">📅 Classes</a>
    <a href="trainers.html">🏋️ Trainers</a>
    <a href="bookings.html">📝 Bookings</a>
    <a href="messages.html" class="active">✉️ Messages</a>
    <a href="../client/index.html" class="site-link">← View Website</a>
  </div>

  <!-- ========== Main ========== -->
  <div class="main">
    <h1>Messages</h1>
    <p class="page-sub">Messages sent from the website's Contact page</p>

    <div class="stat-row">
      <div class="stat"><h2 id="totalMessages">0</h2><p>Total Messages</p></div>
      <div class="stat"><h2 id="unreadMessages">0</h2><p>Unread</p></div>
    </div>

    <div class="box">
      <h2>Inbox</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email / Phone</th>
            <th>Subject</th>
            <th>Message</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="../client/js/storage.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
