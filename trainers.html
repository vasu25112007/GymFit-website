<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Trainers</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ========== Sidebar ========== -->
  <div class="sidebar">
    <div class="logo">Gym<span>Fit</span></div>
    <div class="sub">Admin Panel</div>
    <a href="index.html">👥 Members</a>
    <a href="plans.html">💳 Plans</a>
    <a href="classes.html">📅 Classes</a>
    <a href="trainers.html" class="active">🏋️ Trainers</a>
    <a href="bookings.html">📝 Bookings</a>
    <a href="messages.html">✉️ Messages</a>
    <a href="../client/index.html" class="site-link">← View Website</a>
  </div>

  <!-- ========== Main ========== -->
  <div class="main">
    <h1>Trainers</h1>
    <p class="page-sub">Trainers shown on the website's About page</p>

    <div class="box">
      <h2 id="formTitle">Add New Trainer</h2>
      <form id="trainerForm">
        <div class="form-row">
          <div>
            <label>Name</label>
            <input type="text" id="name" required>
          </div>
          <div>
            <label>Specialty</label>
            <input type="text" id="specialty" placeholder="e.g. Yoga" required>
          </div>
          <div>
            <label>Experience (years)</label>
            <input type="number" id="experience" min="0" required>
          </div>
        </div>
        <button type="submit" class="btn" id="saveBtn">Add Trainer</button>
        <button type="button" class="btn btn-grey" onclick="cancelEdit()">Clear</button>
      </form>
    </div>

    <div class="box">
      <h2>All Trainers</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Specialty</th>
            <th>Experience</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="../client/js/storage.js"></script>
  <script src="js/trainers.js"></script>
</body>
</html>
