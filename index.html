<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Members</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ========== Sidebar ========== -->
  <div class="sidebar">
    <div class="logo">Gym<span>Fit</span></div>
    <div class="sub">Admin Panel</div>
    <a href="index.html" class="active">👥 Members</a>
    <a href="plans.html">💳 Plans</a>
    <a href="classes.html">📅 Classes</a>
    <a href="trainers.html">🏋️ Trainers</a>
    <a href="bookings.html">📝 Bookings</a>
    <a href="messages.html">✉️ Messages</a>
    <a href="../client/index.html" class="site-link">← View Website</a>
  </div>

  <!-- ========== Main ========== -->
  <div class="main">
    <h1>Members</h1>
    <p class="page-sub">Add, edit and delete gym members</p>

    <div class="stat-row">
      <div class="stat"><h2 id="totalMembers">0</h2><p>Total Members</p></div>
      <div class="stat"><h2 id="activeMembers">0</h2><p>Active Members</p></div>
    </div>

    <!-- Add / Edit form -->
    <div class="box">
      <h2 id="formTitle">Add New Member</h2>
      <form id="memberForm">
        <div class="form-row">
          <div>
            <label>Name</label>
            <input type="text" id="name" required>
          </div>
          <div>
            <label>Phone</label>
            <input type="tel" id="phone" required>
          </div>
          <div>
            <label>Plan</label>
            <select id="plan"></select>
          </div>
          <div>
            <label>Join Date</label>
            <input type="date" id="joinDate" required>
          </div>
          <div>
            <label>Status</label>
            <select id="status">
              <option>Active</option>
              <option>Expired</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn" id="saveBtn">Add Member</button>
        <button type="button" class="btn btn-grey" onclick="cancelEdit()">Clear</button>
      </form>
    </div>

    <!-- Members table -->
    <div class="box">
      <h2>All Members</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Plan</th>
            <th>Join Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="../client/js/storage.js"></script>
  <script src="js/members.js"></script>
</body>
</html>
